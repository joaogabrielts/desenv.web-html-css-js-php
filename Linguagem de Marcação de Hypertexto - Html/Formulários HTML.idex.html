    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulários HTML
    </title>
    </head>
    <body>
    <h1>Formulários HTML
    </h1>    
    <form action="" method="post">
    <fieldset>
        <legend>Dados Gerais</legend>
        <label for="nome">Nome:</label>
        <input type="text" minlength="3" id="nome">
        <label for="data_nascimento">Data de nascimento</label>
        <input type="text"  id="data_nascimento">
        <label for="cpf">CPF:</label>
        <input type="cpf"  minlength="11" id="cpf">
    </fieldset>
    <fieldset>
        <legend>Endereço</legend>
        <label for="Tipo">Tipo</label>
        <select  id="tipo">
            <option value="">Selecione</option>
            <optgroup label="São paulo">
                <option value="">Zona norte</option>
                <option value="">zona oeste</option>
                
            </optgroup>
            <optgroup label="Rio de janeiro">
                <option value="">Zona norte</option>
                <option value="">zona oeste</option>
            </optgroup>
        </select>
        <label for="Logradouro">Logradouro</label>
        <input type="text"  id="Logradouro">
        <label for="Numero">Número</label>
        <input type="number"  id="Numero">
        <label for="complemento">Complemento</label>
        <input type="text" id="complemento">
    </fieldset>
    <fieldset>
        <legend>Fale Conosco</legend>
        <label for="mensagem">Mensagem:</label>
   <textarea id="mensagem" name="mensagem" rows="5" cols="40">Digite...</textarea>
   
    </fieldset>
    <fieldset >
        <input type="submit" value="Enviar sua mensagem">
        <input type="reset" value="Limpar o formulario">
    </fieldset>
    </form>
    </body>
    </html>
