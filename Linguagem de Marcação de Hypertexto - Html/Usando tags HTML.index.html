                    <!DOCTYPE html>
                    <html lang="pt-br">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>Princípio da HTML
                    </title>
                    </head>
                    <body>
                        <header>
                            <h1>Minha Página</h1>
                            <nav>
                                <a href="#">Home</a>
                                <a href="#">Sobre</a>
                                <a href="#">Contato</a>
                            </nav>
                        </header> 
                        <main>
                            <h1>Tags Textuais</h1>
                        <p>Este texto è <strong> importante </strong></p>
                        <p>Este texto é <em>enfatizado</em></p>
                        <p>Este texto é <s>tachado</s> </p>
                        <p>H<sub>2</sub>0</p>

                        <p>Este texto está no formato <i>italac</i> </p>
                        <p><del>Este texto foi excluido</del></p>
                        <p><ins>Este texto foi inserido</ins></p>
                        </main>
                        
                    </body>
                </html>
