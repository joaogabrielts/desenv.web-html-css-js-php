    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listas, tabelas e mídias em HTML
    </title>
    </head>
    <body>
        <header>
            <h1>Listas, tabelas e mídias em HTML</h1>
        </header>

        <main>
            <section>
                <h3>Ordenada</h3>
                <ol>
                    <li>Primeiro item</li>
                    <li>Segundo item</li>
                </ol>
            </section>
            <section>
                <h3>não ordenada</h3>
                <ul>
                    <li>Vermelho</li>
                    <li>azul</li>
                </ul>
            </section>
            <section>
                <h3>Tabelas</h3>
                <table>
                    <tr>
                        <th>Itens</th>
                        <th>Quantidade</th>
                        <th>Total</th>
                    </tr>
                    <tr>
                        <td>Registro 01</td>
                        <td>3</td>
                        <td>R$30</td>
                    </tr>
                    <tr>
                        <td>Registro 02</td>
                        <td>2</td>
                        <td>$30</td>
                    </tr>
                </table>
            </section>
        </main>
    </body>
    </html>
