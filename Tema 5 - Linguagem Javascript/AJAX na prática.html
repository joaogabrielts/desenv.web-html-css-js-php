<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJAX na prática</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
        .mb-3{
            width: 40%;
        }
    </style>
  </head>
  <body>
    <h1>AJAX na prática</h1>

    <form class="mb-3">
      <label class="form-label"> nome </label>
      <input type="text" id="n1"   class="form-control"/>
      <a href="#" >
         <button onclick="executar()"  class="btn btn-primary"> Executar</button>
    </a>
    </form>
    <div id="retorno" ></div>
    <script src="AJAX na prática.js"></script>
    <script>
      const executar = () => {
        const nome = document.getElementById("n1").value;
        ajax(nome, "retorno");
      };
    </script>
  </body>
</html>
